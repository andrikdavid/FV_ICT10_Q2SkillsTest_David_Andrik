<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">

    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <title>Non-Metal Finder</title>
</head>

<body>
   
    <!-- Container (wrapper) to center everything -->
    <div class="container">

        <div class="card-wrapper">

            <form>

                <!-- Title header -->
                <div class="header">
                    <h1>Non-Metal Finder</h1>
                </div>

                <!-- Input field for the element symbol -->
                <div class="input">
                    <label for="symbol">Element Symbol</label><br>
                    <input type="text" id="symbol" placeholder=""><br>
                </div>

                <!-- Submit button (triggers pyscript in main.py) -->
                <div class="footer">
                    <button type="button" id="loginBTN" py-click="finder">Enter</button>
                </div>

            </form>

            <!-- Container where results appear -->
            <div id="result-box" class="result-box">
                Please enter an element symbol.
            </div>

        </div>
    </div>

    <!-- Footer of page w/ details -->
    <footer>
        <p>David | Skills Test 1, 10-Sapphire © 2026</p>
    </footer>

    <!-- Link to main.py -->
    <script type="py" src="main.py"></script>

</body>

</html>
